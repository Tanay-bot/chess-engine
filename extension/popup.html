<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Best Move</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 12px 13px 10px;
        background: #0e1218;
        color: #e9edf3;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6b7686;
        flex: none;
      }
      .dot.live {
        background: #4fc57e;
      }
      .dot.warn {
        background: #d9b877;
      }
      .dot.bad {
        background: #e2726e;
      }
      .dot.muted {
        background: #6b7686;
      }
      h1 {
        margin: 0;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #97a3b4;
      }
      .site {
        margin: 6px 0 0;
        font-size: 12px;
        color: #7f8b9c;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .move {
        margin: 8px 0 0;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: #f0e2c2;
      }
      .note {
        margin: 8px 0 0;
        font-size: 12px;
        color: #9aa6b6;
      }
      .note.bad {
        color: #e2726e;
        overflow-wrap: anywhere;
      }
      .actions {
        margin-top: 10px;
      }
      button.primary {
        border-color: #d9b877;
        background: #d9b877;
        color: #16181c;
        font-weight: 600;
      }
      button.primary:hover {
        background: #e6c98d;
        color: #16181c;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid #1c2431;
      }
      button {
        padding: 4px 9px;
        border: 1px solid #2b3648;
        border-radius: 6px;
        background: #131924;
        color: #c3ccd9;
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      button:hover {
        border-color: #d9b877;
        color: #f0e2c2;
      }
      .hint {
        margin-left: auto;
        font-size: 10.5px;
        color: #5d6878;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1 id="state">Checking…</h1>
    </header>
    <p class="site" id="site" hidden></p>
    <p class="move" id="move" hidden></p>
    <p class="note" id="note" hidden></p>
    <div class="actions" id="allow-row" hidden>
      <button type="button" class="primary" id="allow">Allow this site</button>
    </div>
    <footer>
      <button type="button" id="options">Allowed sites</button>
      <span class="hint">Alt+B toggles</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
